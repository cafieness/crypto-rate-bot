services:
  postgres:
    image: postgres:16
    container_name: crypto-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cryptobot
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cryptobot"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/cafieness/crypto-rate-bot:latest
    container_name: crypto-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: crypto-swagger
    ports:
      - "8082:8080"
    environment:
      SWAGGER_JSON: /openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/openapi.yaml
volumes:
  postgres_data: